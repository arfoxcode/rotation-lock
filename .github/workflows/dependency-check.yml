name: Dependency Check

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check for dependency updates
        run: |
          ./gradlew dependencyUpdates \
            -Drevision=release \
            --no-daemon \
            --info | tee dependency-updates.txt || true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-updates
          path: dependency-updates.txt
          retention-days: 30

      - name: Display outdated dependencies summary
        run: |
          if [ -f dependency-updates.txt ]; then
            echo "=== Dependency Update Report ==="
            grep -A 5 "The following dependencies have later" dependency-updates.txt || \
              echo "No outdated dependencies found or report format differs."
          fi
