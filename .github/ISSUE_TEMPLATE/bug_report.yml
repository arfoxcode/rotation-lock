name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Open the app
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. Samsung Galaxy S23, Xiaomi Redmi Note 12"
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android Version
      placeholder: "e.g. Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version
      placeholder: "e.g. v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: vendor_ui
    attributes:
      label: Vendor UI
      description: Which Android skin does your device use?
      options:
        - Stock Android / Android One
        - Samsung OneUI
        - Xiaomi MIUI / HyperOS
        - OPPO ColorOS
        - Realme UI
        - Vivo FunTouch OS
        - OnePlus OxygenOS
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, logs, or any other relevant information
